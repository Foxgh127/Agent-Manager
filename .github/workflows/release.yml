name: Check and release Agent Manager
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release after explicit user authorization'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: agent-manager-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Use canonical temporary paths
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Install and build UI
        shell: pwsh
        run: |
          python -m pip install -e ".[build,test]"
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          python scripts/sync_version.py
          npm ci --ignore-scripts --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed.' }
          npm run build --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
      - name: Verify behavior
        shell: pwsh
        run: |
          python -m pytest -q --tb=short
          if ($LASTEXITCODE -ne 0) { throw 'Backend checks failed.' }
          npm test --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend checks failed.' }
  release:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python scripts/sync_version.py
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid product version.' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed.' }
          $exists = @($releases | Where-Object { $_.tag_name -eq "v$version" -and -not $_.draft }).Count -gt 0
          "publish=$((-not $exists).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Build and publish verified release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -e ".[build]"
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed.' }
          ./scripts/publish.ps1 -Repository $env:GITHUB_REPOSITORY -Build -Publish -NotesFile ./docs/release-notes.md
